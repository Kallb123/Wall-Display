# Wall Calendar config. Copy to config/config.yaml (mounted at /config) and edit.
#
# Secrets (URLs with tokens, API keys, the PIN) are not written here. Use
#   key: !secret some_name
# and put "some_name: value" in secrets.yaml next to this file (see
# secrets.example.yaml). An environment variable WALLCAL_SECRET_SOME_NAME
# (upper case, anything that isn't a letter or digit becomes _) overrides the
# file. Secrets are plain text, so they suit URLs, keys and the PIN.
#
# Other environment variables:
#   WALLCAL_CONFIG_FILE   full path to this file
#   WALLCAL_CONFIG_DIR    folder holding config.yaml and secrets.yaml (default /config)
#   WALLCAL_TIMEZONE      overrides "timezone" below
#
# Unknown keys are errors, so typos are caught when the app starts.

# IANA time zone used to show times (default Europe/London).
timezone: Europe/London

# Who events are shown for. Each person has a name, a colour and a one-letter
# initial (default: the first letter of the name).
# "aliases" are other names an event may use for the person.
# Names and aliases must be unique across people, ignoring case.
people:
  - { id: mum, name: Mum, colour: "#C67139", aliases: [Mummy, Sarah] }
  - { id: dad, name: Dad, colour: "#7A8A5E", aliases: [Daddy, Tom] }
  - { id: isla, name: Isla, colour: "#D27FA0" }
  - { id: theo, name: Theo, colour: "#5F94C4" }
  - { id: poppy, name: Poppy, colour: "#9A7BC4", aliases: [Pops] }
  - { id: home, name: Household, colour: "#D9A93F", initial: H, aliases: [Family, All] }

calendars:
  # One shared calendar for the whole family. Who an event is for comes from its
  # title or description ("Who: Theo"), so titles can stay clean in Google Calendar.
  - id: family
    name: Family
    person: home # used when nothing else matches
    detect_people: true # true (start of title / description lines) | anywhere | false
    detect_in: [title, description] # which fields to read names from
    strip_names: true # show "Swimming", not "Theo: Swimming"
    rules: # case-insensitive regular expressions, for activities that never name anyone
      - { match: "ballet|brownies", people: [isla] }
      - { match: "swimming|football", people: [theo] }
      - { match: "rhyme time|playgroup|nursery", people: [poppy] }
    source:
      type: ics
      url: !secret family_ics_url
      poll_seconds: 120 # default 120, minimum 30

  # A personal calendar: everything on it is Dad's.
  - id: dad-work
    person: dad
    source: { type: ics, url: !secret dad_work_ics_url, poll_seconds: 300 }

  # A Home Assistant calendar, such as bin collection. Needs the homeassistant block below.
  - id: bins
    person: home
    source: { type: homeassistant, entity_id: calendar.bin_collection } # poll_seconds default 300

# Needed if a calendar uses a homeassistant source, or you set up weather below.
homeassistant:
  url: http://homeassistant.local:8123
  token: !secret ha_token # a long-lived access token

# The weather on the wall: the current conditions under today's date in the
# month view, and a forecast for each of the days beside it, and in the agenda.
# Leave this out and no weather is shown. It reads one Home Assistant weather
# entity through the homeassistant block above, so that is needed too.
weather:
  entity_id: weather.home # a weather entity; it must be able to give a daily forecast
  poll_seconds: 600 # default 600; at least 60

# One entry per screen. Open /display?id=hallway on it.
displays:
  - id: hallway
    name: Hallway
    theme: light # light | dark
    month_style: soft # soft | classic
    month_return_minutes: 15 # a month picked on the remote reverts to this month after this long (1-1440)
    week_start: monday # monday | sunday

# What the physical button does. Each gesture is one of:
#   next_view, toggle_photo, toggle_screen, next_month, prev_month, this_month,
#   refresh, ha (the app does nothing; a Home Assistant automation decides), none
button:
  single: next_view
  double: toggle_photo
  long: ha

# Optional shared PIN (4-12 digits, quoted) for the remote page and the settings
# pages. It guards every write under /api (any method but GET, HEAD or OPTIONS:
# commands, refresh, republishing discovery, and saves and uploads to come). The
# remote asks for it once, then sends it in an X-Wallcal-Pin header with each
# write. Reading state, the settings pages' status, and the wall display itself,
# stay open. Ten wrong PINs in five
# minutes from one address lock that address out for the rest of the window.
# Leave out to turn it off. For the local network only.
remote:
  pin: !secret remote_pin

# Built-in policies. Each can also be switched off from Home Assistant.
policies:
  auto_presence:
    off_after_minutes: 10 # screen off after this long with nobody there
    quiet_hours: { from: "22:30", to: "06:30" } # optional; the screen is left alone in this window
  auto_brightness:
    night_below_lux: 3 # optional; below this the night action applies
    night_action: night_view # none | night_view | screen_off

# How many whole months of events are kept: this many before the current month
# and this many after it (0-60 each, default 12 and 12). The remote's month
# picker reaches 12 months either side, so smaller values leave the months
# beyond them empty on the picker. Smaller windows also make each sync cheaper.
sync:
  months_back: 12
  months_ahead: 12

# MQTT, for Home Assistant and other things that talk to the displays. Leave
# out to turn MQTT off; the app works the same without it, and if the broker is
# down it keeps trying in the background. With the compose "mqtt" profile the
# broker is reachable as "mosquitto". With the Home Assistant Mosquitto add-on,
# use the Home Assistant host instead (such as mqtt://homeassistant.local:1883).
# Each display connects as <client_id>-<display id> and publishes under
# wallcal/<display id>/, for example wallcal/hallway/view/state.
# With discovery on, Home Assistant creates a "Wall Calendar" device for each
# display by itself, with no YAML.
mqtt:
  url: mqtt://mosquitto:1883 # mqtt:// or mqtts://, port optional; no username or password in it
  username: wallcal # optional
  password: !secret mqtt_password # optional, needs a username
  client_id: wallcal # default wallcal; 1-64 letters, digits, - and _
  discovery: true # default true; publish Home Assistant's discovery configs. false leaves them out
  discovery_prefix: homeassistant # default homeassistant; change only if Home Assistant's MQTT integration uses another

# Photo frame mode. Leave out if you don't use it. The photos are rendered on
# the server to one 2560x1440 WebP each (portraits and other shapes are fitted
# over a blurred copy of themselves) and kept in photos/ in the data folder, so
# the wall only decodes one image and keeps rotating if a source is down.
photos:
  interval_seconds: 60 # at least 5; how long each photo stays while a display is on the photo view
  landscape_only: false # true leaves portrait photos out of the rotation
  cache_max_mb: 2048 # size cap of the rendered photos; the ones shown longest ago go first
  immich: # not built yet: accepted, but ignored
    url: http://immich.local:2283
    api_key: !secret immich_api_key
    album_ids: [] # empty means the whole library
  google: # not built yet: accepted, but ignored
    client_id: example.apps.googleusercontent.com
    client_secret: !secret google_client_secret
  local:
    # A folder of pictures (jpg, png, webp, avif, gif, tif), sub-folders included;
    # hidden files and folders are left out. Absolute, or relative to the folder
    # holding this file. In Docker, mount it, e.g. ./photos:/photos:ro. A folder
    # that is not there is a warning in the log, not an error.
    path: /photos
