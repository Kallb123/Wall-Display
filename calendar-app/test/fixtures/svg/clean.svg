<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="200" height="100" viewBox="0 0 200 100">
  <title>A pumpkin</title>
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffb347"/>
      <stop offset="1" stop-color="#e8590c"/>
    </radialGradient>
    <circle id="dot" r="6" fill="#2b2118"/>
    <style>.stalk { fill: #3b7a2a; stroke: url(#glow); }</style>
  </defs>
  <ellipse cx="100" cy="55" rx="70" ry="40" fill="url(#glow)"/>
  <rect class="stalk" x="94" y="10" width="12" height="18" rx="3"/>
  <use href="#dot" x="80" y="50"/>
  <use xlink:href="#dot" x="120" y="50"/>
  <a href="#dot"><text x="100" y="95" text-anchor="middle" font-size="10">Boo &amp; co</text></a>
</svg>
