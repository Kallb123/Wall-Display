name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: calendar-app
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: calendar-app/package.json

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: calendar-app/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - name: Check the migrations match the schema
        run: |
          pnpm db:generate
          if [ -n "$(git status --porcelain -- server/db/migrations)" ]; then
            git status --short -- server/db/migrations
            echo "::error::server/db/schema.ts changed without a migration. Run 'pnpm db:generate' and commit the result."
            exit 1
          fi
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  docker:
    runs-on: ubuntu-latest
    env:
      IMAGE: wallcal/calendar-app:ci
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: calendar-app
          push: false
          load: true
          tags: ${{ env.IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start the container
        run: |
          mkdir -p "$RUNNER_TEMP/config" "$RUNNER_TEMP/data"
          cp calendar-app/config.dev.yaml "$RUNNER_TEMP/config/config.yaml"
          # The container runs as uid 1000 and needs to write to /data.
          sudo chown 1000:1000 "$RUNNER_TEMP/data"
          docker run -d --name wallcal -p 8080:8080 \
            -v "$RUNNER_TEMP/config:/config:ro" \
            -v "$RUNNER_TEMP/data:/data" \
            "$IMAGE"

      - name: Wait until the container is healthy
        run: |
          for i in $(seq 1 30); do
            status=$(docker inspect --format '{{.State.Health.Status}}' wallcal)
            echo "health: $status"
            [ "$status" = healthy ] && exit 0
            [ "$(docker inspect --format '{{.State.Running}}' wallcal)" = true ] || break
            sleep 2
          done
          echo "::error::The container did not become healthy."
          exit 1

      - name: Check /api/health from the host
        run: |
          body=$(curl --fail --silent --show-error http://localhost:8080/api/health)
          echo "$body"
          echo "$body" | grep -q '"db":"ok"'
          test -f "$RUNNER_TEMP/data/wallcal.db"
          test "$(docker exec wallcal id -u)" = 1000

      - name: Stop cleanly
        run: |
          docker stop wallcal
          code=$(docker inspect --format '{{.State.ExitCode}}' wallcal)
          echo "exit code: $code"
          test "$code" = 0

      - name: Show the container logs
        if: failure()
        run: docker logs wallcal || true
