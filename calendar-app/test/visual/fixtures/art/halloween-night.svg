<svg xmlns="http://www.w3.org/2000/svg" width="2560" height="1440" viewBox="0 0 2560 1440">
  <!-- The busy parts are at the edges and in the strip at the bottom left that a short side panel leaves clear (from about y 1130); the top left, where the month title sits, is plain dark sky. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b1030"/>
      <stop offset="0.55" stop-color="#2d1a3d"/>
      <stop offset="1" stop-color="#5a2b3c"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd9a5" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffd9a5" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="2560" height="1440" fill="url(#sky)"/>

  <!-- Stars, kept to the right and the top edge. -->
  <g fill="#ffe9c7" opacity="0.8">
    <circle cx="900" cy="30" r="3"/><circle cx="1240" cy="22" r="2.5"/><circle cx="1620" cy="34" r="3"/>
    <circle cx="2010" cy="24" r="2.5"/><circle cx="2330" cy="32" r="3"/><circle cx="2520" cy="210" r="3"/>
    <circle cx="2536" cy="620" r="2.5"/><circle cx="2524" cy="1010" r="3"/><circle cx="716" cy="300" r="3"/>
    <circle cx="722" cy="640" r="2.5"/><circle cx="712" cy="150" r="2.5"/>
  </g>

  <!-- The moon, low behind the house, with its glow. -->
  <circle cx="560" cy="1230" r="230" fill="url(#glow)"/>
  <circle cx="560" cy="1230" r="78" fill="#ffe9c7"/>
  <circle cx="540" cy="1210" r="14" fill="#f1d3a6"/>
  <circle cx="586" cy="1252" r="10" fill="#f1d3a6"/>

  <!-- Bats. -->
  <g fill="#120a1a">
    <path d="M0 0 q30 -40 60 0 q-10 -12 -30 -4 q-20 -8 -30 4 z" transform="translate(120 1190) scale(1.5)"/>
    <path d="M0 0 q30 -40 60 0 q-10 -12 -30 -4 q-20 -8 -30 4 z" transform="translate(330 1160) scale(1.1)"/>
    <path d="M0 0 q30 -40 60 0 q-10 -12 -30 -4 q-20 -8 -30 4 z" transform="translate(610 1170) scale(1.3)"/>
  </g>

  <!-- A bare tree on the left edge. -->
  <g stroke="#120a1a" stroke-linecap="round" fill="none">
    <path d="M50 1440 L58 1300 L48 1190" stroke-width="20"/>
    <path d="M58 1300 L130 1240 L160 1170" stroke-width="12"/>
    <path d="M54 1250 L12 1190" stroke-width="10"/>
    <path d="M130 1240 L182 1256" stroke-width="8"/>
    <path d="M48 1190 L74 1140" stroke-width="8"/>
  </g>

  <!-- The hill, the house and its lit windows. -->
  <path d="M0 1440 L0 1380 Q250 1320 500 1350 Q650 1368 760 1340 L760 1440 Z" fill="#120a1a"/>
  <g fill="#120a1a">
    <rect x="230" y="1230" width="230" height="140"/>
    <path d="M214 1232 L345 1150 L476 1232 Z"/>
    <rect x="410" y="1160" width="28" height="60"/>
    <rect x="258" y="1172" width="50" height="70"/>
    <path d="M254 1174 L283 1124 L312 1174 Z"/>
  </g>
  <g fill="#f6a06b">
    <rect x="262" y="1262" width="38" height="50" rx="6"/>
    <rect x="388" y="1262" width="38" height="50" rx="6"/>
    <rect x="322" y="1312" width="44" height="52" rx="22"/>
    <rect x="268" y="1190" width="30" height="38" rx="15"/>
  </g>

  <!-- Pumpkins in front. -->
  <g>
    <ellipse cx="560" cy="1372" rx="56" ry="42" fill="#d9691f"/>
    <ellipse cx="560" cy="1372" rx="33" ry="42" fill="#f08a2e"/>
    <path d="M558 1331 q-2 -20 13 -27" fill="none" stroke="#4d6b2f" stroke-width="9" stroke-linecap="round"/>
    <path d="M536 1364 l14 0 l-7 12 z M570 1364 l14 0 l-7 12 z M542 1388 q18 16 36 0 l-7 -4 l-5 7 l-6 -7 l-5 7 l-6 -7 z" fill="#2a1535"/>
    <ellipse cx="640" cy="1400" rx="36" ry="28" fill="#d9691f"/>
    <ellipse cx="640" cy="1400" rx="21" ry="28" fill="#f08a2e"/>
    <path d="M639 1373 q-1 -13 9 -18" fill="none" stroke="#4d6b2f" stroke-width="6" stroke-linecap="round"/>
    <ellipse cx="150" cy="1396" rx="48" ry="36" fill="#d9691f"/>
    <ellipse cx="150" cy="1396" rx="28" ry="36" fill="#f08a2e"/>
    <path d="M148 1362 q-2 -16 11 -23" fill="none" stroke="#4d6b2f" stroke-width="8" stroke-linecap="round"/>
  </g>

  <!-- Webs in the bottom right corner and a low line of hills along the bottom edge. -->
  <path d="M760 1440 Q1400 1380 2000 1420 Q2300 1440 2560 1400 L2560 1440 Z" fill="#120a1a"/>
  <g stroke="#ffe9c7" stroke-opacity="0.35" stroke-width="3" fill="none">
    <path d="M2560 1100 L2290 1440 M2560 1170 L2420 1440 M2560 1030 L2190 1440"/>
    <path d="M2560 1260 Q2490 1280 2480 1360 Q2500 1300 2560 1260 M2560 1180 Q2430 1240 2400 1380"/>
  </g>
</svg>
