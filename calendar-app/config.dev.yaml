# Config for `pnpm dev`: no secrets and no Home Assistant, so it loads as is.
# `pnpm dev` uses this file when WALLCAL_CONFIG_FILE and WALLCAL_CONFIG_DIR are not set.
#
# The calendars below are the ICS fixtures in test/fixtures/ics/: a family
# calendar and Dad's work calendar, set in October 2026 around Wed 28 Oct.
# A relative file: URL is resolved from the folder holding this config file.

timezone: Europe/London

people:
  - { id: mum, name: Mum, colour: "#C67139", aliases: [Mummy, Sarah] }
  - { id: dad, name: Dad, colour: "#7A8A5E", aliases: [Daddy, Tom] }
  - { id: isla, name: Isla, colour: "#D27FA0" }
  - { id: theo, name: Theo, colour: "#5F94C4" }
  - { id: poppy, name: Poppy, colour: "#9A7BC4", aliases: [Pops] }
  - { id: home, name: Household, colour: "#D9A93F", initial: H, aliases: [Family, All] }

calendars:
  # One shared family calendar: names in titles and descriptions, plus keyword rules.
  - id: family
    name: Family
    person: home
    detect_people: true
    strip_names: true
    rules:
      - { match: "ballet|brownies", people: [isla] }
      - { match: "swimming|football", people: [theo] }
      - { match: "rhyme time|playgroup|nursery", people: [poppy] }
    source: { type: ics, url: "file:./test/fixtures/ics/family.ics" }

  # A personal calendar: everything on it is Dad's.
  - id: dad-work
    name: Dad's work
    person: dad
    source: { type: ics, url: "file:./test/fixtures/ics/dad-work.ics" }

displays:
  - id: hallway
    name: Hallway
    theme: light

# MQTT is off here. To try it against a broker on this machine (for example
# `docker compose --profile mqtt up -d` from the repo root), remove the # signs:
# mqtt:
#   url: mqtt://localhost:1883

# Photo frame mode (architecture §5). The pictures are the small fixtures in
# test/fixtures/photos/ (made by scripts/make-photo-fixtures.mjs): a landscape,
# a portrait, a square and a phone photo saved on its side. Like a file: URL, a
# relative path is from the folder holding this config file. If the folder is
# not there (the Docker CI job copies only this file into the container), the
# photo frame has nothing to show and the server logs a warning, nothing worse.
photos:
  interval_seconds: 15
  local:
    path: ./test/fixtures/photos
