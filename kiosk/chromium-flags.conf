# Chromium flags for the wall display kiosk.
#
# Format: one flag per line. Blank lines and lines starting with # are ignored;
# there are no inline comments. Each line is passed to Chromium as one argument.
#
# Read by bin/wallcal-kiosk. The hardware render probe (plan item H.1) will reuse
# this file so its benchmark runs with the same flags as the real kiosk.
#
# setup.sh replaces this file on every run. Put your own additions in
# /etc/wallcal-kiosk/chromium-flags.local.conf instead (same format, read after this one).
#
# Chromium only honours the last --disable-features and the last --enable-features,
# so each may appear at most once across both files. To disable another feature,
# extend the --disable-features line here rather than adding a second one.

# Full-screen window with no browser chrome.
--kiosk

# Talk to the compositor directly; the Pi has no X server.
--ozone-platform=wayland

# No crash or error dialogs: nobody is there to click them.
--noerrdialogs

# No welcome page or "make Chromium your default browser" prompt.
--no-first-run
--no-default-browser-check

# No "translate this page?" bubble.
--disable-features=Translate,TranslateUI

# No "Restore pages?" bubble after an unclean exit.
--hide-crash-restore-bubble

# No keyring prompt: there is no keyring in this session.
--password-store=basic

# Rasterise on the GPU. The Pi's V3D GPU is blocklisted for some features by
# default, so ignore the blocklist too.
--enable-gpu-rasterization
--ignore-gpu-blocklist

# Touch screens should not pinch-zoom or swipe back through history.
--disable-pinch
--overscroll-history-navigation=0

# Never nag about updates; the Pi is updated through apt.
--check-for-update-interval=31536000
