# This folder is copied to a Raspberry Pi and run in place (`./hw-probe`), so nothing here needs installing. The file
# only names the project and holds the lint and test settings.
[project]
name = "wallcal-hw-probe"
version = "0.1.0"
description = "Hardware probes for the Wall Display: run on a real Raspberry Pi and monitor, standard library only."
# Raspberry Pi OS Bookworm's system Python is 3.11.
requires-python = ">=3.11"
dependencies = []

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["hw_probe"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
