<svg xmlns="http://www.w3.org/2000/svg" width="2560" height="1440" viewBox="0 0 2560 1440">
  <!-- Christmas, 2560×1440: the night sky alone. It stays behind the view, whichever side of it the rest of the art is drawn. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0c2238"/>
      <stop offset="0.6" stop-color="#112d48"/>
      <stop offset="1" stop-color="#1f4a6e"/>
    </linearGradient>
  </defs>
  <rect width="2560" height="1440" fill="url(#sky)"/>
</svg>
