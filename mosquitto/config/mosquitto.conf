# Mosquitto for Wall Display. Used by `docker compose --profile mqtt up`.

listener 1883

# Anyone who can reach port 1883 can publish and subscribe. That is fine on a
# trusted home LAN and keeps the setup working out of the box, but do not expose
# this port to the internet.
#
# To require a login instead, create a password file (the container's mosquitto
# user must own it), then switch the two lines below:
#   docker run --rm -it -v "$PWD/mosquitto/config:/mosquitto/config" eclipse-mosquitto:2 \
#     sh -c 'mosquitto_passwd -c /mosquitto/config/passwords wallcal && chown mosquitto: /mosquitto/config/passwords'
#   allow_anonymous false
#   password_file /mosquitto/config/passwords
# Clients (the app, the Pi agent, Home Assistant) then need that user and password.
allow_anonymous true

persistence true
persistence_location /mosquitto/data/

# Log to the container output (docker compose logs mosquitto).
log_dest stdout
