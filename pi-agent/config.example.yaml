# Which display this Pi belongs to: the id from the app's config (displays[].id).
display_id: hallway

mqtt:
  host: homeserver.local     # required
  port: 1883                 # default 1883
  username: wallcal          # optional
  password: CHANGE_ME        # optional, needs a username. The file is 0640 root:wallcal-agent.
  tls: false                 # default false; true connects with TLS using the system CA store
  client_id: wallcal-pi-hallway  # default wallcal-pi-<display_id>; 1-64 letters, digits, - and _
  discovery: true            # default true; publish Home Assistant discovery configs
  discovery_prefix: homeassistant  # default homeassistant

# How often the diagnostic sensors (CPU temperature, uptime) are published.
diagnostics_interval_seconds: 60   # default 60, at least 5

# Sensors wired to this Pi. All off by default. Each one's settings are in the block of the same name below.
sensors:
  button: false
  presence: false
  light: false

# The push button, used when sensors.button is true. Wire it between the GPIO and ground (GND): the Pi's own
# pull-up holds the input high, and a press pulls it low. What each press does is set in the app's own config.
# These are checked even while the button is off.
button:
  pin: 17                    # default 17; the BCM GPIO number (GPIO17 is physical pin 11), 0 to 27
  bounce_ms: 30              # default 30, 0 to 200; a change counts once the input has stayed that way this long
  double_press_ms: 400       # default 400, 100 to 2000; the longest gap from letting go to pressing again for a double
  long_press_ms: 1000        # default 1000, 300 to 10000; held this long is a long press, reported while still held

# The mmWave presence sensor (an LD2410), used when sensors.presence is true. The agent publishes whether someone is
# there to pi/presence (retained), and the app's auto presence policy can turn the screen on and off with it. These
# are checked even while the sensor is off.
#
# Wiring, either way: VCC to 5 V, GND to GND.
#   gpio - OUT to the GPIO below (GPIO27 is physical pin 13). The sensor drives it high while it sees someone.
#   uart - TX to GPIO15 (RXD, pin 10) and RX to GPIO14 (TXD, pin 8), with the serial port switched on and the serial
#          console off in raspi-config (Interface Options, Serial Port: login shell No, hardware Yes).
presence:
  source: gpio               # default gpio: the OUT pin as a plain input. Or uart: read the sensor's data frames
  pin: 27                    # default 27; the BCM GPIO number, 0 to 27. Used by source gpio. Not the button's pin
  hold_ms: 500               # default 500, 0 to 10000; a change only counts once it has held this long
  uart:                      # used by source uart
    device: /dev/serial0     # default /dev/serial0; the serial port, an absolute path
    baud: 256000             # default 256000, the sensor's factory rate; or 9600 19200 38400 57600 115200 230400 460800

# The ambient light sensor (a VEML7700 or a BH1750 on the I2C bus), used when sensors.light is true. The agent publishes
# the room's brightness in lux to pi/illuminance, and the app's auto brightness policy can dim the display with it.
# These are checked even while the sensor is off.
#
# Wiring, for either chip: VIN to 3.3 V (pin 1), GND to GND (pin 6), SDA to GPIO2 (pin 3), SCL to GPIO3 (pin 5).
# Switch I2C on first: sudo raspi-config, Interface Options, I2C. Then i2cdetect -y 1 (from the i2c-tools package)
# should show 10 for a VEML7700, or 23 for a BH1750.
light:
  chip: veml7700             # default veml7700; or bh1750
  bus: 1                     # default 1, 0 to 31; the I2C bus, /dev/i2c-<bus>. Bus 1 is the one on pins 3 and 5
  address: 0x10              # default is the chip's own: 0x10 for the veml7700 (its only one), 0x23 for the bh1750 (or 0x5c with its ADDR pin high)
  sample_ms: 1000            # default 1000, 200 to 60000; how often the sensor is read
  change_percent: 10         # default 10, 1 to 100; a reading is published when it is this share different from the last one published...
  change_lux: 0.5            # default 0.5, 0 to 1000; ...and at least this many lux different, so flicker in the dark is not a change
  report_seconds: 30         # default 30, 5 to 3600; published at least this often even when nothing changes

# How the agent turns the panel on and off when the app asks (pi/screen/set), and reports what it is doing.
# Nothing is touched until the first request. The display page also goes pure black when the screen is "off",
# whichever back end is chosen.
screen:
  # black   - leave the panel alone; the page's black is all there is. Needs nothing set up. (default)
  # cec     - switch the monitor on or to standby over HDMI CEC with cec-client (package cec-utils).
  # output  - switch the HDMI output off and on in the kiosk's Wayland compositor (wlopm or wlr-randr).
  backend: black
  cec:                       # used by the cec back end
    device: 0                # default 0 (the TV); a CEC logical address, 0 to 15
  output:                    # used by the output back end
    tool: wlopm              # default wlopm; or wlr-randr
    name: HDMI-A-1           # default HDMI-A-1; the output's name (list them with: wlopm)
    wayland_display: /run/user/1000/wayland-0   # default; the kiosk's Wayland socket
  command_timeout_seconds: 10   # default 10, 1 to 60; how long cec-client, wlopm or wlr-randr may take
  poll_seconds: 60           # default 60; how often the real panel state is read and published if it changed. 0 = never, else at least 5
