# Wall Calendar config. Copy to config/config.yaml (mounted at /config) and edit.
#
# Secrets (URLs with tokens, API keys, the PIN) are not written here. Use
#   key: !secret some_name
# and put "some_name: value" in secrets.yaml next to this file (see
# secrets.example.yaml). An environment variable WALLCAL_SECRET_SOME_NAME
# (upper case, anything that isn't a letter or digit becomes _) overrides the
# file. Secrets are plain text, so they suit URLs, keys and the PIN.
#
# Other environment variables:
#   WALLCAL_CONFIG_FILE   full path to this file
#   WALLCAL_CONFIG_DIR    folder holding config.yaml and secrets.yaml (default /config)
#   WALLCAL_TIMEZONE      overrides "timezone" below
#
# Unknown keys are errors, so typos are caught when the app starts.

# IANA time zone used to show times (default Europe/London).
timezone: Europe/London

# Who events are shown for. Each person has a name, a colour and a one-letter
# initial (default: the first letter of the name).
# "aliases" are other names an event may use for the person.
# Names and aliases must be unique across people, ignoring case.
people:
  - { id: mum, name: Mum, colour: "#C67139", aliases: [Mummy, Sarah] }
  - { id: dad, name: Dad, colour: "#7A8A5E", aliases: [Daddy, Tom] }
  - { id: isla, name: Isla, colour: "#D27FA0" }
  - { id: theo, name: Theo, colour: "#5F94C4" }
  - { id: poppy, name: Poppy, colour: "#9A7BC4", aliases: [Pops] }
  - { id: home, name: Household, colour: "#D9A93F", initial: H, aliases: [Family, All] }

# Optional. A group is a name for several people: "Party for the kids" is then
# for Isla, Theo and Poppy. A group's name and aliases match like a person's,
# and share the uniqueness rule with them (no clashes with people or other
# groups, ignoring case). "people" lists person ids; a group id must differ from
# every person id. A calendar rule's "people" may list a group id too.
groups:
  - { id: kids, name: Kids, aliases: [Children], people: [isla, theo, poppy] }

calendars:
  # One shared calendar for the whole family. Who an event is for comes from its
  # title or description ("Who: Theo"), so titles can stay clean in Google Calendar.
  - id: family
    name: Family
    person: home # used when nothing else matches
    detect_people: true # true (start of title / description lines) | anywhere | false
    detect_in: [title, description] # which fields to read names from
    strip_names: true # show "Swimming", not "Theo: Swimming"
    rules: # case-insensitive regular expressions, for activities that never name anyone
      - { match: "ballet|brownies", people: [isla] }
      - { match: "swimming|football", people: [theo] }
      - { match: "rhyme time|playgroup|nursery", people: [poppy] }
    source:
      type: ics
      url: !secret family_ics_url
      poll_seconds: 120 # default 120, minimum 30

  # A personal calendar: everything on it is Dad's.
  - id: dad-work
    person: dad
    source: { type: ics, url: !secret dad_work_ics_url, poll_seconds: 300 }

  # A Home Assistant calendar, such as bin collection. Needs the homeassistant block below.
  - id: bins
    person: home
    source: { type: homeassistant, entity_id: calendar.bin_collection } # poll_seconds default 300

# Needed if a calendar uses a homeassistant source, or you set up weather below.
homeassistant:
  url: http://homeassistant.local:8123
  token: !secret ha_token # a long-lived access token

# The weather on the wall: the current conditions under today's date in the
# month view, and a forecast for each of the days beside it, and in the agenda.
# Leave this out and no weather is shown. It reads one Home Assistant weather
# entity through the homeassistant block above, so that is needed too.
weather:
  entity_id: weather.home # a weather entity; it must be able to give a daily forecast
  poll_seconds: 600 # default 600; at least 60

# The next alarm, for a display whose night view has night_text: next_alarm
# (see displays below). It reads one Home Assistant entity through the
# homeassistant block above: the companion app's next alarm sensor, or an
# input_datetime that has a date. Leave this out and no alarm is read.
# alarm:
#   entity_id: sensor.pixel_8_next_alarm # a sensor or input_datetime entity
#   poll_seconds: 300 # default 300; at least 30

# One entry per screen. Open /display?id=hallway on it.
# theme, month_style, month_return_minutes, week_start, week_hours, day_parts,
# burn_in, night_text and orientation can also be changed on the /settings Displays tab
# while the app runs. A change made there is stored in the database on top of
# this file and wins over it until you press Reset there; this file is never written.
displays:
  - id: hallway
    name: Hallway
    theme: light # light | dark
    month_style: soft # soft | classic
    month_return_minutes: 15 # a month or week picked on the remote reverts to the current one after this long (1-1440)
    week_start: monday # monday | sunday
    burn_in: true # default true; slowly shift the content and move the photo frame's clock between corners, against burn-in
    night_text: first_event # none (default) | first_event | next_alarm; the line under the night view's clock. next_alarm needs the alarm block above
    orientation: auto # auto (default) | landscape | portrait; auto lays out portrait when the screen is taller than it is wide. ?orientation= on the display URL overrides it for one device
    week_hours: { from: 7, to: 21 } # the hours the week view draws in full (whole hours, from 0-23 to 1-24); earlier and later hours are folded into a thin band
    day_parts: { afternoon: 12, evening: 17 } # where the week by part of day view (week_parts) splits a day: morning is before afternoon, evening from evening on (whole hours, 1 <= afternoon < evening <= 23)
    # Optional built-in schedules: rules that put a view on the wall for part of
    # the day. Each schedule has an id (letters, digits, - and _), an optional
    # name (default: the id) and rules. A rule is a view, from and to ("HH:MM",
    # in `timezone`, which must differ) and days. days is every_day (default),
    # weekdays, weekends or a list such as [mon, wed, fri]. from later than to
    # wraps past midnight, and days is then the day the window starts. A rule
    # that needs the photo frame (view: photo) needs the photos block below.
    # The rules act only at their start and end: at the end the wall goes back to
    # the view from before the window (if nobody has changed it), and a view
    # chosen by hand lasts until the next start or end. Each schedule gets a
    # switch in Home Assistant ("Schedule <name>") to turn it off, for a holiday.
    schedules:
      - id: mornings
        name: Morning agenda
        rules:
          - { view: agenda, from: "06:30", to: "09:00" }
      - id: daytime-photos
        name: Daytime photos
        rules:
          - { view: photo, from: "10:00", to: "16:00", days: weekdays }

# What the physical button does (the Pi agent's button: sensors.button in the
# agent's config). Each gesture is one of:
#   next_view      the next calendar view (month, agenda, week, week_parts)
#   toggle_photo   the photo frame, or back to the view it replaced
#   next_photo     the next photo (and the photo wait starts again)
#   toggle_screen  the screen off, or on
#   next_month, prev_month, this_month   change the month shown
#   next_week, prev_week, this_week      change the week shown
#   refresh        sync the calendars now
#   ha             the app does nothing; a Home Assistant automation decides
#   none           nothing at all
button:
  single: next_view
  double: toggle_photo
  long: ha

# Optional shared PIN (4-12 digits, quoted) for the remote page and the settings
# pages. It guards every write under /api (any method but GET, HEAD or OPTIONS:
# commands, refresh, republishing discovery, and saves and uploads to come). The
# remote asks for it once, then sends it in an X-Wallcal-Pin header with each
# write. Reading state, the settings pages' status, and the wall display itself,
# stay open. Ten wrong PINs in five
# minutes from one address lock that address out for the rest of the window.
# Leave out to turn it off. For the local network only.
remote:
  pin: !secret remote_pin

# Built-in policies. Each can also be switched off from Home Assistant. Their
# thresholds (everything here but the brightness curve) can also be changed on
# the /settings Displays tab, like the display settings above.
policies:
  # Needs the Pi agent's presence sensor (sensors.presence in the agent's
  # config), which publishes pi/presence. Presence turns the screen on; nobody
  # there for off_after_minutes turns it off. The Auto presence switch in Home
  # Assistant turns the policy off, for when an automation takes over.
  auto_presence:
    off_after_minutes: 10 # screen off after this long with nobody there
    # Optional. In this window (the local time in `timezone`) the screen is left
    # alone both ways: presence doesn't turn it on and nobody doesn't turn it
    # off. from and to must differ; from later than to wraps past midnight.
    quiet_hours: { from: "22:30", to: "06:30" }
  # Needs the Pi agent's light sensor (sensors.light in the agent's config),
  # which publishes pi/illuminance. While the policy is on it owns the
  # brightness: one you set by hand lasts only until the next reading moves it.
  # The Auto brightness switch in Home Assistant turns the policy off, for when
  # an automation takes over.
  auto_brightness:
    # Lux to brightness (0-100), as points that go up in lux. It is read on a
    # log scale between the points, as the eye sees light, and is flat beyond
    # the first and last. For reference, a dark room is under 5 lx, a living
    # room in the evening 50-150 and daylight indoors 300 or more. This is the
    # default.
    curve:
      - { lux: 0, brightness: 30 }
      - { lux: 20, brightness: 60 }
      - { lux: 200, brightness: 100 }
    min_step: 5 # the brightness moves only once the curve asks for this much more or less (1-50), so it doesn't flicker; either end of the curve is always reached
    smoothing_seconds: 30 # how slowly a change in the light is followed (0-600); 0 follows every reading at once
    # Optional. Below this the room counts as dark and the night action applies.
    night_below_lux: 3
    # Optional. The room counts as light again from this lux up, so a room
    # hovering around night_below_lux doesn't flip in and out. Needs
    # night_below_lux, and must be above it. Left out, twice night_below_lux.
    # night_above_lux: 6
    # What dark does: none, night_view (the night view is shown, and the view
    # you had comes back when the room is light) or screen_off (the screen is
    # turned off, and on again when the room is light). Either one is only
    # undone if you haven't changed the view or the screen in the meantime.
    # Anything other than none needs night_below_lux.
    night_action: night_view

# How many whole months of events are kept: this many before the current month
# and this many after it (0-60 each, default 12 and 12). The remote's month
# picker reaches 12 months either side, so smaller values leave the months
# beyond them empty on the picker. Smaller windows also make each sync cheaper.
sync:
  months_back: 12
  months_ahead: 12

# MQTT, for Home Assistant and other things that talk to the displays. Leave
# out to turn MQTT off; the app works the same without it, and if the broker is
# down it keeps trying in the background. With the compose "mqtt" profile the
# broker is reachable as "mosquitto". With the Home Assistant Mosquitto add-on,
# use the Home Assistant host instead (such as mqtt://homeassistant.local:1883).
# Each display connects as <client_id>-<display id> and publishes under
# wallcal/<display id>/, for example wallcal/hallway/view/state.
# With discovery on, Home Assistant creates a "Wall Calendar" device for each
# display by itself, with no YAML.
mqtt:
  url: mqtt://mosquitto:1883 # mqtt:// or mqtts://, port optional; no username or password in it
  username: wallcal # optional
  password: !secret mqtt_password # optional, needs a username
  client_id: wallcal # default wallcal; 1-64 letters, digits, - and _
  discovery: true # default true; publish Home Assistant's discovery configs. false leaves them out
  discovery_prefix: homeassistant # default homeassistant; change only if Home Assistant's MQTT integration uses another

# Photo frame mode. Leave out if you don't use it. The photos are rendered on
# the server to one WebP each, the shape of the display (2560x1440, or 1440x2560
# on a portrait display). A photo that is not that shape is fitted over a blurred
# copy of itself. They are kept in photos/ in the data folder, so the wall only
# decodes one image and keeps rotating if a source is down.
photos:
  interval_seconds: 60 # at least 5; how long each photo stays while a display is on the photo view (also on the /settings Displays tab)
  match_orientation: false # true shows each display only photos of its own shape: no portrait photos on a landscape display, no landscape ones on a portrait display
  # landscape_only: false # the older name of match_orientation, which it still means
  cache_max_mb: 2048 # size cap of the rendered photos; the ones shown longest ago go first
  immich: # photos from Immich. Previews only (thumbnail?size=preview), never the originals
    url: http://immich.local:2283 # may have a path if Immich is behind a reverse proxy; no user name or password in it
    api_key: !secret immich_api_key # Immich -> Account Settings -> API Keys; sent as the x-api-key header
    # Which photos: albums (every photo in album_ids), random (a random pick from the
    # whole library, a new one every 10 minutes) or memories (today's "on this day",
    # or a random pick on a day with none). Left out, it is albums when album_ids has
    # something in it, and random when it is empty.
    # mode: albums
    album_ids: [] # album ids, from the album's address in Immich
    # random: # for mode random, and for memories on a day with none; all optional
    #   count: 200 # photos in each pick (1 to 1000)
    #   person_ids: ["5c7e9a1b-3d5f-4b7a-9c2e-4f6a8b0c2d03"] # only photos of these people (Immich -> People)
    #   taken_after: "2022-01-01" # quote dates; a day starts at midnight UTC
    #   taken_before: "2024-12-31" # and this one includes the whole day
  google: # not built yet: accepted, but ignored
    client_id: example.apps.googleusercontent.com
    client_secret: !secret google_client_secret
  local:
    # A folder of pictures (jpg, png, webp, avif, gif, tif), sub-folders included;
    # hidden files and folders are left out. Absolute, or relative to the folder
    # holding this file. In Docker, mount it, e.g. ./photos:/photos:ro. A folder
    # that is not there is a warning in the log, not an error.
    path: /photos
