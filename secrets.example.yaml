# Copy to secrets.yaml next to config.yaml and fill in real values.
# secrets.yaml is never committed. The values here are placeholders.
# Each one can instead be set as an environment variable,
# for example WALLCAL_SECRET_FAMILY_ICS_URL.

# Google Calendar -> Settings -> [calendar] -> Integrate calendar -> Secret address in iCal format
family_ics_url: https://calendar.google.com/calendar/ical/CHANGE_ME/private-CHANGE_ME/basic.ics
dad_work_ics_url: https://calendar.google.com/calendar/ical/CHANGE_ME/private-CHANGE_ME/basic.ics

# Home Assistant -> your profile -> Security -> Long-lived access tokens
ha_token: CHANGE_ME_HOME_ASSISTANT_TOKEN

# Immich -> Account Settings -> API Keys
immich_api_key: CHANGE_ME_IMMICH_KEY

google_client_secret: CHANGE_ME_GOOGLE_SECRET

# The MQTT broker's password (Mosquitto: mosquitto_passwd, or a Home Assistant user)
mqtt_password: CHANGE_ME_MQTT_PASSWORD

# 4 to 12 digits, in quotes so a leading zero is kept
remote_pin: "1234"
