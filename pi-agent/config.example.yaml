# Which display this Pi belongs to: the id from the app's config (displays[].id).
display_id: hallway

mqtt:
  host: homeserver.local     # required
  port: 1883                 # default 1883
  username: wallcal          # optional
  password: CHANGE_ME        # optional, needs a username. The file is 0640 root:wallcal-agent.
  tls: false                 # default false; true connects with TLS using the system CA store
  client_id: wallcal-pi-hallway  # default wallcal-pi-<display_id>; 1-64 letters, digits, - and _
  discovery: true            # default true; publish Home Assistant discovery configs
  discovery_prefix: homeassistant  # default homeassistant

# How often the diagnostic sensors (CPU temperature, uptime) are published.
diagnostics_interval_seconds: 60   # default 60, at least 5

# Sensors wired to this Pi. All off by default. The button is built (see the button block below). The presence and
# light sensors arrive in later pull requests; until then an enabled one is validated and logged as "not built yet".
sensors:
  button: false
  presence: false
  light: false

# The push button, used when sensors.button is true. Wire it between the GPIO and ground (GND): the Pi's own
# pull-up holds the input high, and a press pulls it low. What each press does is set in the app's own config.
# These are checked even while the button is off.
button:
  pin: 17                    # default 17; the BCM GPIO number (GPIO17 is physical pin 11), 0 to 27
  bounce_ms: 30              # default 30, 0 to 200; a change counts once the input has stayed that way this long
  double_press_ms: 400       # default 400, 100 to 2000; the longest gap from letting go to pressing again for a double
  long_press_ms: 1000        # default 1000, 300 to 10000; held this long is a long press, reported while still held

# How the agent turns the panel on and off when the app asks (pi/screen/set), and reports what it is doing.
# Nothing is touched until the first request. The display page also goes pure black when the screen is "off",
# whichever back end is chosen.
screen:
  # black   - leave the panel alone; the page's black is all there is. Needs nothing set up. (default)
  # cec     - switch the monitor on or to standby over HDMI CEC with cec-client (package cec-utils).
  # output  - switch the HDMI output off and on in the kiosk's Wayland compositor (wlopm or wlr-randr).
  backend: black
  cec:                       # used by the cec back end
    device: 0                # default 0 (the TV); a CEC logical address, 0 to 15
  output:                    # used by the output back end
    tool: wlopm              # default wlopm; or wlr-randr
    name: HDMI-A-1           # default HDMI-A-1; the output's name (list them with: wlopm)
    wayland_display: /run/user/1000/wayland-0   # default; the kiosk's Wayland socket
  command_timeout_seconds: 10   # default 10, 1 to 60; how long cec-client, wlopm or wlr-randr may take
  poll_seconds: 60           # default 60; how often the real panel state is read and published if it changed. 0 = never, else at least 5
