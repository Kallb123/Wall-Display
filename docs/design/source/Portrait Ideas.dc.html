<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/organic-b7c8e5cf-1b74-40ce-b592-4fc0cbde078f/styles.css">
<script src="_ds/organic-b7c8e5cf-1b74-40ce-b592-4fc0cbde078f/_ds_bundle.js"></script>
<style>body{margin:0}a{color:var(--color-accent)}a:hover{color:var(--color-accent-600)}</style>
</helmet>
<div data-screen-label="Portrait · Idea" style="width:1440px;height:2560px;box-sizing:border-box;padding:48px 40px;display:flex;flex-direction:column;gap:28px;background:{{ t.bg }};color:{{ t.text }};font-family:var(--font-body);overflow:hidden">
  <div style="display:flex;align-items:center;gap:24px;padding:0 12px;flex:none">
    <div style="display:flex;align-items:baseline;gap:18px;min-width:0;white-space:nowrap">
      <div style="font-family:var(--font-heading);font-size:72px;line-height:1;letter-spacing:-0.02em">{{ title }}</div>
      <div style="font-family:var(--font-heading);font-size:36px;line-height:1;color:{{ t.muted }}">{{ subtitle }}</div>
    </div>
    <div style="flex:1"></div>
    <div style="display:flex;align-items:center;gap:12px;font-size:32px;font-weight:700;color:{{ t.muted }}">
      <svg viewBox="0 0 24 24" width="40" height="40" style="flex:none;fill:none;stroke:currentColor;stroke-width:2.75;stroke-linecap:round;stroke-linejoin:round"><path d="M4 14.899A7 7 0 1 1 15.71 8h1.79a4.5 4.5 0 0 1 2.5 8.242"></path><path d="M16 14v6"></path><path d="M8 14v6"></path><path d="M12 16v6"></path></svg>
      <div>12°</div>
    </div>
    <div style="font-family:var(--font-heading);font-size:72px;line-height:1;font-variant-numeric:tabular-nums">14:24</div>
  </div>
  <sc-if value="{{ isList }}" hint-placeholder-val="{{ true }}">
    <div style="flex:1;display:flex;flex-direction:column;gap:14px;min-height:0">
      <sc-for list="{{ days }}" as="d" hint-placeholder-count="7">
        <div style="flex:{{ d.flex }};min-height:0;position:relative;display:grid;grid-template-columns:210px minmax(0,1fr);gap:28px;padding:26px 32px;border-radius:40px;background:{{ d.tileBg }};overflow:hidden">
          <div style="display:flex;flex-direction:column;gap:8px">
            <div style="display:flex;align-items:baseline;gap:14px">
              <div style="font-family:var(--font-heading);font-size:64px;line-height:1;color:{{ d.numInk }}">{{ d.n }}</div>
              <div style="font-size:24px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:{{ t.muted }}">{{ d.wd }}</div>
            </div>
            <sc-if value="{{ d.hasWx }}" hint-placeholder-val="{{ false }}">
              <div style="display:flex;align-items:center;gap:8px;font-size:22px;font-weight:700;color:{{ t.muted }}">
                <svg viewBox="0 0 24 24" width="28" height="28" style="flex:none;fill:none;stroke:currentColor;stroke-width:2.75;stroke-linecap:round;stroke-linejoin:round"><sc-if value="{{ d.isRain }}" hint-placeholder-val="{{ false }}"><path d="M4 14.899A7 7 0 1 1 15.71 8h1.79a4.5 4.5 0 0 1 2.5 8.242"></path><path d="M16 14v6"></path><path d="M8 14v6"></path><path d="M12 16v6"></path></sc-if><sc-if value="{{ d.isSun }}" hint-placeholder-val="{{ false }}"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2"></path><path d="M12 20v2"></path><path d="m4.93 4.93 1.41 1.41"></path><path d="m17.66 17.66 1.41 1.41"></path><path d="M2 12h2"></path><path d="M20 12h2"></path><path d="m6.34 17.66-1.41 1.41"></path><path d="m19.07 4.93-1.41 1.41"></path></sc-if><sc-if value="{{ d.isCloudSun }}" hint-placeholder-val="{{ false }}"><path d="M12 2v2"></path><path d="m4.93 4.93 1.41 1.41"></path><path d="M20 12h2"></path><path d="m19.07 4.93-1.41 1.41"></path><path d="M15.947 12.65a4 4 0 0 0-5.925-4.128"></path><path d="M13 22H7a5 5 0 1 1 4.9-6H13a3 3 0 0 1 0 6Z"></path></sc-if><sc-if value="{{ d.isCloud }}" hint-placeholder-val="{{ false }}"><path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"></path></sc-if></svg>
                <div>{{ d.range }}</div>
              </div>
            </sc-if>
          </div>
          <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:repeat(4,44px);grid-auto-flow:column;gap:10px 28px;align-content:start;min-width:0">
            <sc-for list="{{ d.items }}" as="it" hint-placeholder-count="3">
              <div style="display:flex;align-items:center;gap:12px;min-width:0;padding:0 14px 0 4px;border-radius:999px;background:{{ it.pill }};font-size:26px;opacity:{{ it.op }}">
                <div style="width:36px;height:36px;flex:none;border-radius:999px;display:grid;place-items:center;font-size:18px;font-weight:700;background:{{ it.color }};color:var(--color-neutral-900)">{{ it.initial }}</div>
                <div style="flex:none;font-size:23px;font-weight:700;color:{{ t.muted }};font-variant-numeric:tabular-nums">{{ it.time }}</div>
                <div style="min-width:0;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ it.title }}</div>
              </div>
            </sc-for>
          </div>
          <div style="position:absolute;inset:0;border-radius:40px;pointer-events:none;background:{{ d.veil }}"></div>
        </div>
      </sc-for>
    </div>
  </sc-if>
  <sc-if value="{{ isPeople }}" hint-placeholder-val="{{ false }}">
    <div style="flex:1;display:grid;grid-template-columns:64px repeat(6,minmax(0,1fr));grid-template-rows:170px minmax(0,1fr);column-gap:10px;min-height:0">
      <sc-for list="{{ people }}" as="p" hint-placeholder-count="6">
        <div style="grid-row:1 / -1;border-radius:32px;background:{{ t.tile }};display:flex;flex-direction:column;min-width:0;overflow:hidden">
          <div style="flex:none;height:170px;box-sizing:border-box;padding:18px 14px 14px;display:flex;flex-direction:column;align-items:center;gap:10px;background:{{ p.headBg }}">
            <div style="width:68px;height:68px;border-radius:999px;display:grid;place-items:center;font-family:var(--font-heading);font-size:36px;background:{{ p.color }};color:var(--color-neutral-900)">{{ p.initial }}</div>
            <div style="font-size:26px;font-weight:700">{{ p.name }}</div>
          </div>
          <div style="flex:1;position:relative;min-height:0">
            <sc-for list="{{ hours }}" as="h" hint-placeholder-count="13">
              <div style="position:absolute;left:10px;right:10px;height:2px;top:{{ h.top }};background:{{ t.line }}"></div>
            </sc-for>
            <sc-for list="{{ p.allday }}" as="a" hint-placeholder-count="0">
              <div style="position:absolute;z-index:1;top:12px;left:8px;right:8px;height:40px;border-radius:999px;display:flex;align-items:center;padding:0 16px;font-size:20px;font-weight:700;white-space:nowrap;overflow:hidden;background:{{ a.bg }};color:{{ t.barText }}">{{ a.title }}</div>
            </sc-for>
            <sc-for list="{{ p.blocks }}" as="b" hint-placeholder-count="1">
              <div style="position:absolute;left:8px;right:8px;top:{{ b.top }};height:{{ b.height }};box-sizing:border-box;padding:1px 0">
                <div style="height:100%;box-sizing:border-box;border-radius:16px;padding:8px 12px;background:{{ b.bg }};color:{{ t.barText }};overflow:hidden;opacity:{{ b.op }};display:flex;flex-direction:column;gap:2px">
                  <div style="font-size:19px;font-weight:700;color:{{ t.muted }};white-space:nowrap">{{ b.time }} – {{ b.until }}</div>
                  <div style="font-size:22px;font-weight:600;line-height:1.2;overflow-wrap:anywhere">{{ b.title }}</div>
                </div>
              </div>
            </sc-for>
            <div style="position:absolute;left:0;right:0;z-index:2;top:{{ nowTop }};height:4px;background:{{ t.accent }};transform:translateY(-50%)"></div>
          </div>
        </div>
      </sc-for>
      <div style="grid-column:1;grid-row:2;position:relative;min-height:0">
        <sc-for list="{{ hours }}" as="h" hint-placeholder-count="13">
          <div style="position:absolute;right:4px;top:{{ h.top }};transform:translateY({{ h.ty }});visibility:{{ h.vis }};font-size:19px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1;color:{{ t.muted }}">{{ h.label }}</div>
        </sc-for>
        <div style="position:absolute;right:0;z-index:2;top:{{ nowTop }};transform:translateY(-50%);padding:3px 8px;border-radius:999px;background:{{ t.accent }};color:{{ t.todayNumFg }};font-size:18px;font-weight:700;line-height:1.1">{{ nowTime }}</div>
      </div>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:2560},&quot;idea&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;week_list&quot;,&quot;people_day&quot;],&quot;default&quot;:&quot;week_list&quot;,&quot;tsType&quot;:&quot;'week_list'|'people_day'&quot;},&quot;theme&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;light&quot;,&quot;dark&quot;],&quot;default&quot;:&quot;light&quot;,&quot;tsType&quot;:&quot;'light'|'dark'&quot;}}">
class Component extends DCLogic {
  state = { m: null };
  componentDidMount() { import('./portrait-data.js').then(m => this.setState({ m })); }
  renderVals() {
    const theme = this.props.theme ?? 'light', idea = this.props.idea ?? 'week_list';
    const isList = idea === 'week_list', isPeople = !isList;
    const head = isList ? { title: '26 Oct – 1 Nov', subtitle: 'This week' } : { title: 'Wednesday 28', subtitle: 'October' };
    const m = this.state.m;
    if (!m) return { t: {}, days: [], people: [], hours: [], isList, isPeople, ...head };
    const k = theme + idea;
    if (this._k !== k) {
      this._k = k;
      if (isList) {
        const w = m.buildWeek(theme), T = w.t;
        this._d = { t: T, days: w.days.map((d, i) => ({ ...d, flex: i < 2 ? '0.55' : '1', veil: i < 2 ? T.veil : 'transparent', numInk: d.isToday ? T.accentInk : T.text,
          items: d.items.map(it => ({ ...it, pill: it.isAllDay ? it.bg : 'transparent', time: it.isAllDay ? '' : it.time })) })) };
      } else {
        this._d = m.buildPeopleDay(theme);
      }
    }
    return { ...this._d, isList, isPeople, ...head };
  }
}
</script>
</body>
</html>
