name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: calendar-app
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: calendar-app/package.json

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: calendar-app/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - name: Check the migrations match the schema
        run: |
          pnpm db:generate
          if [ -n "$(git status --porcelain -- server/db/migrations)" ]; then
            git status --short -- server/db/migrations
            echo "::error::server/db/schema.ts changed without a migration. Run 'pnpm db:generate' and commit the result."
            exit 1
          fi
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  display:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: calendar-app
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: calendar-app/package.json

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: calendar-app/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # The Chromium revision that goes with the pinned @playwright/test, the one the baselines were made with.
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:visual

      # TEMPORARY: the fixture events as CI builds them, and what the failed pages showed.
      - name: Fingerprint the fixture events
        if: failure()
        run: |
          cat > fx2.tmp.ts <<'TS'
          import { createHash } from 'node:crypto'
          import { fixtureEvents } from './test/helpers/fixtureEvents'
          const events = fixtureEvents({ configFile: 'test/visual/config.visual.yaml' })
          console.log(process.version, Intl.DateTimeFormat().resolvedOptions().timeZone, events.length, createHash('sha1').update(JSON.stringify(events)).digest('hex'))
          const perDay = new Map<string, number>()
          for (const e of events) { const d = (e.start_date ?? e.start).slice(0, 10); if (d.startsWith('2026-10')) perDay.set(d, (perDay.get(d) ?? 0) + 1) }
          console.log([...perDay].sort().map(([d, n]) => `${d.slice(8)}:${n}`).join(' '))
          for (const e of events.filter(e => (e.start_date ?? e.start).startsWith('2026-10-28'))) console.log(e.id, e.start, e.end, e.display_title, e.people.map(p => p.id).join(','))
          TS
          node node_modules/.pnpm/jiti@*/node_modules/jiti/lib/jiti-cli.mjs ./fx2.tmp.ts
          # The light month's actual screenshot, base64 in 4000-character lines between markers.
          for f in test-results/month-October-2026-light-theme-chromium/october-light-actual.png; do echo "BEGIN-PNG $f"; base64 -w 4000 "$f" || true; echo END-PNG; done

      # TEMPORARY: print where the screenshot diffs are, as the artifact can't be fetched from the session.
      - name: Summarise screenshot diffs
        if: failure()
        run: |
          python3 - test-results test/visual <<'PY'
          """Summarise Playwright screenshot diffs as text: where the changed pixels are and what colours changed.
          Usage: python3 diffmap.py <test-results dir> <snapshots root>"""
          import glob
          import os
          import struct
          import sys
          import zlib


          def read_png(path):
              data = open(path, 'rb').read()
              pos, idat, w, h, ctype = 8, b'', 0, 0, 0
              while pos < len(data):
                  n, kind = struct.unpack('>I4s', data[pos:pos + 8])
                  body = data[pos + 8:pos + 8 + n]
                  if kind == b'IHDR':
                      w, h, depth, ctype = struct.unpack('>IIBB', body[:10])
                      assert depth == 8, depth
                  elif kind == b'IDAT':
                      idat += body
                  pos += 12 + n
              bpp = {2: 3, 6: 4}[ctype]
              raw = zlib.decompress(idat)
              stride = w * bpp
              rows, prev, i = [], bytearray(stride), 0
              for _ in range(h):
                  f = raw[i]
                  line = bytearray(raw[i + 1:i + 1 + stride])
                  i += 1 + stride
                  if f == 1:
                      for x in range(bpp, stride):
                          line[x] = (line[x] + line[x - bpp]) & 255
                  elif f == 2:
                      for x in range(stride):
                          line[x] = (line[x] + prev[x]) & 255
                  elif f == 3:
                      for x in range(stride):
                          left = line[x - bpp] if x >= bpp else 0
                          line[x] = (line[x] + ((left + prev[x]) >> 1)) & 255
                  elif f == 4:
                      for x in range(stride):
                          a = line[x - bpp] if x >= bpp else 0
                          b = prev[x]
                          c = prev[x - bpp] if x >= bpp else 0
                          p = a + b - c
                          pa, pb, pc = abs(p - a), abs(p - b), abs(p - c)
                          line[x] = (line[x] + (a if pa <= pb and pa <= pc else b if pb <= pc else c)) & 255
                  rows.append(line)
                  prev = line
              return w, h, bpp, rows


          def px(img, x, y):
              w, h, bpp, rows = img
              return tuple(rows[y][x * bpp:x * bpp + 3])


          CELL = 80
          for diff_path in sorted(glob.glob(os.path.join(sys.argv[1], '**', '*-diff.png'), recursive=True)):
              name = os.path.basename(diff_path)[:-len('-diff.png')]
              actual = read_png(diff_path.replace('-diff.png', '-actual.png'))
              expected_glob = glob.glob(os.path.join(sys.argv[2], '**', f'{name}-chromium-linux.png'), recursive=True)
              expected = read_png(expected_glob[0]) if expected_glob else None
              w, h, bpp, rows = read_png(diff_path)
              cells = {}
              for y in range(h):
                  row = rows[y]
                  for x in range(w):
                      r, g, b = row[x * bpp], row[x * bpp + 1], row[x * bpp + 2]
                      if r > 200 and g < 80 and b < 80:  # pixelmatch's red
                          key = (x // CELL, y // CELL)
                          c = cells.setdefault(key, [0, x, y])
                          c[0] += 1
              total = sum(c[0] for c in cells.values())
              print(f'=== {name}: {total} red pixels in {len(cells)} cells of {CELL}px')
              gw, gh = (w + CELL - 1) // CELL, (h + CELL - 1) // CELL
              for gy in range(gh):
                  line = ''
                  for gx in range(gw):
                      n = cells.get((gx, gy), [0])[0]
                      line += '.' if n == 0 else str(min(9, n // 50)) if n >= 50 else '+'
                  print(line)
              for (gx, gy), (n, x, y) in sorted(cells.items(), key=lambda kv: -kv[1][0])[:25]:
                  exp = px(expected, x, y) if expected else None
                  print(f'cell ({gx * CELL},{gy * CELL}) n={n} first=({x},{y}) expected={exp} actual={px(actual, x, y)}')
          PY

      - name: Keep the report and the failed screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            calendar-app/playwright-report/
            calendar-app/test-results/
          retention-days: 7

  docker:
    runs-on: ubuntu-latest
    env:
      IMAGE: wallcal/calendar-app:ci
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: calendar-app
          push: false
          load: true
          tags: ${{ env.IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start the container
        run: |
          mkdir -p "$RUNNER_TEMP/config" "$RUNNER_TEMP/data"
          cp calendar-app/config.dev.yaml "$RUNNER_TEMP/config/config.yaml"
          # The container runs as uid 1000 and needs to write to /data.
          sudo chown 1000:1000 "$RUNNER_TEMP/data"
          docker run -d --name wallcal -p 8080:8080 \
            -v "$RUNNER_TEMP/config:/config:ro" \
            -v "$RUNNER_TEMP/data:/data" \
            "$IMAGE"

      - name: Wait until the container is healthy
        run: |
          for i in $(seq 1 30); do
            status=$(docker inspect --format '{{.State.Health.Status}}' wallcal)
            echo "health: $status"
            [ "$status" = healthy ] && exit 0
            [ "$(docker inspect --format '{{.State.Running}}' wallcal)" = true ] || break
            sleep 2
          done
          echo "::error::The container did not become healthy."
          exit 1

      - name: Check /api/health from the host
        run: |
          body=$(curl --fail --silent --show-error http://localhost:8080/api/health)
          echo "$body"
          echo "$body" | grep -q '"db":"ok"'
          test -f "$RUNNER_TEMP/data/wallcal.db"
          test "$(docker exec wallcal id -u)" = 1000

      - name: Stop cleanly
        run: |
          docker stop wallcal
          code=$(docker inspect --format '{{.State.ExitCode}}' wallcal)
          echo "exit code: $code"
          test "$code" = 0

      - name: Show the container logs
        if: failure()
        run: docker logs wallcal || true
