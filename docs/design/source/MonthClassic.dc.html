<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/organic-b7c8e5cf-1b74-40ce-b592-4fc0cbde078f/styles.css">
<script src="_ds/organic-b7c8e5cf-1b74-40ce-b592-4fc0cbde078f/_ds_bundle.js"></script>
<style>body{margin:0}a{color:var(--color-accent)}a:hover{color:var(--color-accent-600)}</style>
</helmet>
<div data-screen-label="Month · Classic" style="width:2560px;height:1440px;box-sizing:border-box;padding:56px 64px;display:grid;grid-template-columns:minmax(0,1fr) 680px;gap:64px;background:{{ t.bg }};color:{{ t.text }};font-family:var(--font-body);overflow:hidden">
  <div style="display:flex;flex-direction:column;min-width:0;min-height:0">
    
    <div style="display:grid;grid-template-columns:repeat(7,minmax(0,1fr));padding-bottom:12px;font-size:22px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:{{ t.muted }}">
      <div style="padding-left:16px">Mon</div><div style="padding-left:16px">Tue</div><div style="padding-left:16px">Wed</div><div style="padding-left:16px">Thu</div><div style="padding-left:16px">Fri</div><div style="padding-left:16px">Sat</div><div style="padding-left:16px">Sun</div>
    </div>
    <div style="flex:1;display:flex;flex-direction:column;min-height:0">
      <sc-for list="{{ weeks }}" as="w" hint-placeholder-count="6">
        <div style="flex:1;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));grid-template-rows:50px repeat(4,34px) 1fr;row-gap:5px;border-top:2px solid {{ t.line }};padding-top:4px">
          <sc-for list="{{ w.days }}" as="d" hint-placeholder-count="7">
            <div style="grid-column:{{ d.col }};grid-row:1 / -1;margin:0 4px 6px;border-radius:24px;background:{{ d.cellBg }}"></div>
            <div style="grid-column:{{ d.col }};grid-row:1;padding-left:8px;display:flex;align-items:center">
              <div style="min-width:46px;height:46px;border-radius:999px;display:grid;place-items:center;font-size:26px;font-weight:700;background:{{ d.numBg }};color:{{ d.numFg }}">{{ d.n }}</div>
            </div>
          </sc-for>
          <sc-for list="{{ w.bars }}" as="b" hint-placeholder-count="2">
            <div style="grid-column:{{ b.col }};grid-row:{{ b.row }};margin:0 {{ b.mr }} 0 {{ b.ml }};border-radius:{{ b.rl }} {{ b.rr }} {{ b.rr }} {{ b.rl }};background:{{ b.bg }};color:{{ t.barText }};display:flex;align-items:center;gap:10px;padding:0 14px;font-size:20px;font-weight:700;white-space:nowrap;overflow:hidden;min-width:0">
              <div style="width:12px;height:12px;border-radius:999px;flex:none;background:{{ b.color }}"></div>
              <div style="overflow:hidden;text-overflow:ellipsis">{{ b.title }}</div>
            </div>
          </sc-for>
          <sc-for list="{{ w.timed }}" as="e" hint-placeholder-count="3">
            <div style="grid-column:{{ e.col }};grid-row:{{ e.row }};display:flex;align-items:center;gap:8px;padding:0 14px 0 16px;font-size:20px;min-width:0;white-space:nowrap;overflow:hidden">
              <div style="width:12px;height:12px;border-radius:999px;flex:none;background:{{ e.color }}"></div>
              <div style="font-weight:700;color:{{ t.muted }};flex:none">{{ e.time }}</div>
              <div style="overflow:hidden;text-overflow:ellipsis;font-weight:600">{{ e.title }}</div>
            </div>
          </sc-for>
          <sc-for list="{{ w.more }}" as="m" hint-placeholder-count="1">
            <div style="grid-column:{{ m.col }};grid-row:{{ m.row }};padding:0 16px;display:flex;align-items:center;font-size:20px;font-weight:700;color:{{ t.accentInk }}">{{ m.label }}</div>
          </sc-for>
          <sc-for list="{{ w.past }}" as="p" hint-placeholder-count="2">
            <div style="grid-column:{{ p.col }};grid-row:1 / -1;margin:0 4px 6px;border-radius:24px;pointer-events:none;background:{{ t.veil }}"></div>
          </sc-for>
        </div>
      </sc-for>
    </div>
  </div>
  <div style="display:flex;flex-direction:column;gap:28px;min-width:0;min-height:0">
    <div style="display:flex;align-items:baseline;gap:20px;padding-left:8px">
      <div style="font-family:var(--font-heading);font-size:84px;line-height:1;letter-spacing:-0.02em">October</div>
      <div style="font-family:var(--font-heading);font-size:48px;line-height:1;color:{{ t.muted }}">2026</div>
    </div>
    <div style="background:{{ t.surface }};border-radius:40px;padding:36px 40px;display:flex;flex-direction:column;gap:28px">
      <div style="display:flex;align-items:center;gap:28px">
        <svg viewBox="0 0 24 24" width="96" height="96" style="flex:none;color:{{ t.accent }};fill:none;stroke:currentColor;stroke-width:2.75;stroke-linecap:round;stroke-linejoin:round"><path d="M4 14.899A7 7 0 1 1 15.71 8h1.79a4.5 4.5 0 0 1 2.5 8.242"></path><path d="M16 14v6"></path><path d="M8 14v6"></path><path d="M12 16v6"></path></svg>
        <div style="font-family:var(--font-heading);font-size:120px;line-height:0.9">12°</div>
        <div style="display:flex;flex-direction:column;gap:6px">
          <div style="font-size:30px;font-weight:700">Light showers</div>
          <div style="font-size:24px;font-weight:600;color:{{ t.muted }}">High 14° · Low 8°</div>
        </div>
      </div>
      <div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px">
        <sc-for list="{{ forecast }}" as="f" hint-placeholder-count="3">
          <div style="display:flex;align-items:center;gap:12px;font-size:24px">
            <div style="font-weight:700;width:52px">{{ f.short }}</div>
            <svg viewBox="0 0 24 24" width="34" height="34" style="flex:none;color:{{ t.accent }};fill:none;stroke:currentColor;stroke-width:2.75;stroke-linecap:round;stroke-linejoin:round">
              <sc-if value="{{ f.isRain }}"><path d="M4 14.899A7 7 0 1 1 15.71 8h1.79a4.5 4.5 0 0 1 2.5 8.242"></path><path d="M16 14v6"></path><path d="M8 14v6"></path><path d="M12 16v6"></path></sc-if>
              <sc-if value="{{ f.isSun }}"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2"></path><path d="M12 20v2"></path><path d="m4.93 4.93 1.41 1.41"></path><path d="m17.66 17.66 1.41 1.41"></path><path d="M2 12h2"></path><path d="M20 12h2"></path><path d="m6.34 17.66-1.41 1.41"></path><path d="m19.07 4.93-1.41 1.41"></path></sc-if>
              <sc-if value="{{ f.isCloudSun }}"><path d="M12 2v2"></path><path d="m4.93 4.93 1.41 1.41"></path><path d="M20 12h2"></path><path d="m19.07 4.93-1.41 1.41"></path><path d="M15.947 12.65a4 4 0 0 0-5.925-4.128"></path><path d="M13 22H7a5 5 0 1 1 4.9-6H13a3 3 0 0 1 0 6Z"></path></sc-if>
            </svg>
            <div style="font-weight:600">{{ f.hi }}° <span style="color:{{ t.muted }}">/ {{ f.lo }}°</span></div>
          </div>
        </sc-for>
      </div>
    </div>
    <div style="display:flex;flex-direction:column;gap:24px;padding:0 8px;min-height:0;overflow:hidden">
      <sc-for list="{{ agenda }}" as="a" hint-placeholder-count="4">
        <div style="display:flex;flex-direction:column;gap:12px">
          <div style="display:flex;align-items:baseline;gap:16px">
            <div style="font-family:var(--font-heading);font-size:42px;line-height:1.1;color:{{ a.labelColor }}">{{ a.label }}</div>
            <div style="font-size:24px;font-weight:600;color:{{ t.muted }}">{{ a.date }}</div>
          </div>
          <sc-for list="{{ a.items }}" as="it" hint-placeholder-count="3">
            <div style="display:grid;grid-template-columns:16px 110px minmax(0,1fr);align-items:center;gap:16px;font-size:28px;line-height:1.3">
              <div style="width:16px;height:16px;border-radius:999px;background:{{ it.color }}"></div>
              <div style="font-size:24px;font-weight:700;color:{{ t.muted }}">{{ it.time }}</div>
              <div style="font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ it.title }}</div>
            </div>
          </sc-for>
        </div>
      </sc-for>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:2560,&quot;height&quot;:1440},&quot;theme&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;light&quot;,&quot;dark&quot;],&quot;default&quot;:&quot;light&quot;,&quot;tsType&quot;:&quot;'light'|'dark'&quot;}}">
class Component extends DCLogic {
  state = { m: null };
  componentDidMount() { import('./wall-data.js').then(m => this.setState({ m })); }
  renderVals() {
    const theme = this.props.theme ?? 'light';
    const m = this.state.m;
    if (!m) return { t: {}, weeks: [], agenda: [], forecast: [] };
    if (this._k !== theme) { this._k = theme; this._d = m.buildMonth(theme); }
    return this._d;
  }
}
</script>
</body>
</html>
