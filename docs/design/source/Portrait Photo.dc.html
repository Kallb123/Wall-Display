<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/organic-b7c8e5cf-1b74-40ce-b592-4fc0cbde078f/styles.css">
<script src="_ds/organic-b7c8e5cf-1b74-40ce-b592-4fc0cbde078f/_ds_bundle.js"></script>
<style>body{margin:0}a{color:var(--color-accent)}a:hover{color:var(--color-accent-600)}</style>
</helmet>
<div data-screen-label="Portrait · Photo frame" style="width:100%;height:100%;position:relative;overflow:hidden;isolation:isolate;background:#000;font-family:var(--font-body)">
  <sc-if value="{{ isFill }}" hint-placeholder-val="{{ true }}">
    <img src="assets/photo.jpg" alt="" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover">
  </sc-if>
  <sc-if value="{{ isBlur }}" hint-placeholder-val="{{ false }}">
    <img src="assets/photo-landscape.png" alt="" style="position:absolute;inset:-8%;width:116%;height:116%;object-fit:cover;filter:blur(48px) brightness(0.8) saturate(1.1)">
    <img src="assets/photo-landscape.png" alt="" style="position:absolute;inset:0;width:100%;height:100%;object-fit:contain">
  </sc-if>
  <sc-if value="{{ isFull }}" hint-placeholder-val="{{ true }}">
    <div style="position:absolute;z-index:3;top:{{ pos.top }};right:{{ pos.right }};bottom:{{ pos.bottom }};left:{{ pos.left }};max-width:calc(100% - 128px);box-sizing:border-box;display:flex;flex-direction:column;gap:20px;padding:28px 52px 28px 44px;border-radius:40px;background:rgba(20,18,16,0.55);backdrop-filter:blur(28px);box-shadow:0 8px 32px rgba(0,0,0,0.25);color:#fff;text-shadow:0 2px 8px rgba(0,0,0,0.35)">
      <div style="display:flex;align-items:center;gap:48px">
        <div style="font-family:var(--font-heading);font-size:128px;line-height:1;font-variant-numeric:tabular-nums">14:24</div>
        <div style="display:flex;align-items:center;gap:16px;font-size:72px;font-weight:700;line-height:1">
          <svg viewBox="0 0 24 24" width="64" height="64" style="flex:none;fill:none;stroke:currentColor;stroke-width:2.75;stroke-linecap:round;stroke-linejoin:round"><path d="M4 14.899A7 7 0 1 1 15.71 8h1.79a4.5 4.5 0 0 1 2.5 8.242"></path><path d="M16 14v6"></path><path d="M8 14v6"></path><path d="M12 16v6"></path></svg>
          <div>12°</div>
        </div>
      </div>
      <div style="display:flex;align-items:center;gap:24px;min-width:0;font-size:52px;line-height:1.2">
        <div style="flex:none;width:14px;height:64px;border-radius:999px;background:oklch(0.64 0.075 235)"></div>
        <div style="flex:none;font-weight:700;font-variant-numeric:tabular-nums">15:30</div>
        <div style="min-width:0;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">Playdate at Sam's</div>
      </div>
    </div>
  </sc-if>
  <sc-if value="{{ isCompact }}" hint-placeholder-val="{{ false }}">
    <div style="position:absolute;z-index:3;top:{{ pos.top }};right:{{ pos.right }};bottom:{{ pos.bottom }};left:{{ pos.left }};max-width:calc(100% - 96px);box-sizing:border-box;display:flex;flex-direction:column;gap:14px;padding:22px 40px 22px 34px;border-radius:32px;background:rgba(20,18,16,0.55);backdrop-filter:blur(28px);box-shadow:0 8px 32px rgba(0,0,0,0.25);color:#fff;text-shadow:0 2px 8px rgba(0,0,0,0.35)">
      <div style="display:flex;align-items:center;gap:36px">
        <div style="font-family:var(--font-heading);font-size:96px;line-height:1;font-variant-numeric:tabular-nums">14:24</div>
        <div style="display:flex;align-items:center;gap:12px;font-size:54px;font-weight:700;line-height:1">
          <svg viewBox="0 0 24 24" width="48" height="48" style="flex:none;fill:none;stroke:currentColor;stroke-width:2.75;stroke-linecap:round;stroke-linejoin:round"><path d="M4 14.899A7 7 0 1 1 15.71 8h1.79a4.5 4.5 0 0 1 2.5 8.242"></path><path d="M16 14v6"></path><path d="M8 14v6"></path><path d="M12 16v6"></path></svg>
          <div>12°</div>
        </div>
      </div>
      <div style="display:flex;align-items:center;gap:18px;min-width:0;font-size:40px;line-height:1.2">
        <div style="flex:none;width:12px;height:48px;border-radius:999px;background:oklch(0.64 0.075 235)"></div>
        <div style="flex:none;font-weight:700;font-variant-numeric:tabular-nums">15:30</div>
        <div style="min-width:0;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">Playdate at Sam's</div>
      </div>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:2560},&quot;fit&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;fill&quot;,&quot;blur&quot;],&quot;default&quot;:&quot;fill&quot;,&quot;tsType&quot;:&quot;'fill'|'blur'&quot;},&quot;size&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;full&quot;,&quot;compact&quot;],&quot;default&quot;:&quot;full&quot;,&quot;tsType&quot;:&quot;'full'|'compact'&quot;},&quot;corner&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;top-left&quot;,&quot;top-right&quot;,&quot;bottom-left&quot;,&quot;bottom-right&quot;],&quot;default&quot;:&quot;bottom-left&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const fit = this.props.fit ?? 'fill', size = this.props.size ?? 'full', corner = this.props.corner ?? 'bottom-left';
    const g = size === 'compact' ? '48px' : '64px';
    const [v, h] = corner.split('-');
    return {
      isFill: fit === 'fill', isBlur: fit === 'blur', isFull: size === 'full', isCompact: size === 'compact',
      pos: { top: v === 'top' ? g : 'auto', bottom: v === 'bottom' ? g : 'auto', left: h === 'left' ? g : 'auto', right: h === 'right' ? g : 'auto' },
    };
  }
}
</script>
</body>
</html>
