<svg xmlns="http://www.w3.org/2000/svg" width="2560" height="1440" viewBox="0 0 2560 1440">
  <!-- Light, for the sage palette, whose text is dark. Confetti at the edges, presents at the bottom left. -->
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4fbe8"/>
      <stop offset="1" stop-color="#d6e6bb"/>
    </linearGradient>
  </defs>
  <rect width="2560" height="1440" fill="url(#ground)"/>

  <!-- Bunting along the very top edge, clear of the month title and the weekday names. -->
  <path d="M0 10 H2560" fill="none" stroke="#8fa073" stroke-width="4"/>
  <g>
    <path d="M100 12 l30 0 l-15 32 z" fill="#f4a8c0"/>
    <path d="M270 12 l30 0 l-15 32 z" fill="#f6b73c"/>
    <path d="M440 12 l30 0 l-15 32 z" fill="#92bce8"/>
    <path d="M610 12 l30 0 l-15 32 z" fill="#f4a8c0"/>
    <path d="M780 12 l30 0 l-15 32 z" fill="#f6b73c"/>
    <path d="M950 12 l30 0 l-15 32 z" fill="#92bce8"/>
    <path d="M1120 12 l30 0 l-15 32 z" fill="#f4a8c0"/>
    <path d="M1290 12 l30 0 l-15 32 z" fill="#f6b73c"/>
    <path d="M1460 12 l30 0 l-15 32 z" fill="#92bce8"/>
    <path d="M1630 12 l30 0 l-15 32 z" fill="#f4a8c0"/>
    <path d="M1800 12 l30 0 l-15 32 z" fill="#f6b73c"/>
    <path d="M1970 12 l30 0 l-15 32 z" fill="#92bce8"/>
    <path d="M2140 12 l30 0 l-15 32 z" fill="#f4a8c0"/>
    <path d="M2310 12 l30 0 l-15 32 z" fill="#f6b73c"/>
    <path d="M2480 12 l30 0 l-15 32 z" fill="#92bce8"/>
  </g>

  <!-- Confetti. -->
  <g>
    <circle cx="730" cy="260" r="9" fill="#f4a8c0"/><circle cx="716" cy="470" r="8" fill="#f6b73c"/>
    <circle cx="724" cy="760" r="9" fill="#92bce8"/><circle cx="718" cy="1010" r="8" fill="#f4a8c0"/>
    <circle cx="2530" cy="330" r="9" fill="#92bce8"/><circle cx="2536" cy="700" r="8" fill="#f4a8c0"/>
    <circle cx="2526" cy="1060" r="9" fill="#f6b73c"/><circle cx="1500" cy="1418" r="9" fill="#f4a8c0"/>
    <circle cx="1100" cy="1416" r="8" fill="#92bce8"/><circle cx="1900" cy="1420" r="9" fill="#f6b73c"/>
    <rect x="80" y="170" width="22" height="9" rx="3" fill="#92bce8" transform="rotate(30 91 174)"/>
    <rect x="560" y="190" width="22" height="9" rx="3" fill="#f4a8c0" transform="rotate(-25 571 194)"/>
    <rect x="30" y="430" width="22" height="9" rx="3" fill="#f6b73c" transform="rotate(50 41 434)"/>
    <rect x="2000" y="1410" width="22" height="9" rx="3" fill="#92bce8" transform="rotate(20 2011 1414)"/>
    <rect x="1300" y="1412" width="22" height="9" rx="3" fill="#f4a8c0" transform="rotate(-40 1311 1416)"/>
    <rect x="2540" y="880" width="22" height="9" rx="3" fill="#92bce8" transform="rotate(35 2551 884)"/>
  </g>

  <!-- A table of presents at the bottom left, in the strip a short side panel leaves clear (from about y 1130), with room beside them for the balloon. -->
  <rect x="40" y="1380" width="680" height="60" rx="14" fill="#c9b08a"/>
  <g>
    <rect x="60" y="1250" width="130" height="130" rx="10" fill="#92bce8"/>
    <rect x="113" y="1250" width="24" height="130" fill="#fff6f0"/>
    <path d="M125 1250 q-38 -48 -56 -18 q18 18 56 18 q38 0 56 -18 q-18 -30 -56 18 z" fill="#fff6f0"/>
    <rect x="210" y="1300" width="100" height="80" rx="10" fill="#f4a8c0"/>
    <rect x="248" y="1300" width="24" height="80" fill="#fff6f0"/>
    <rect x="330" y="1270" width="110" height="110" rx="10" fill="#f6b73c"/>
    <rect x="374" y="1270" width="24" height="110" fill="#fff6f0"/>
    <rect x="655" y="1325" width="55" height="55" rx="8" fill="#9a7bc4"/>
    <rect x="677" y="1325" width="12" height="55" fill="#fff6f0"/>
  </g>
