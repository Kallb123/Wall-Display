name: Publish images

# Builds the calendar-app image for amd64 and arm64 and pushes it to GHCR as
# ghcr.io/<owner>/<repo>/calendar-app (lowercased), which docker-compose.yml uses.
#
#   push to main   :latest and :sha-<short sha>
#   tag v1.2.3     :1.2.3, :1.2 and :sha-<short sha>
#
# Each platform builds on a native runner (ubuntu-24.04-arm for arm64) rather
# than under QEMU: "nuxt build" (Vite and rolldown, multi-threaded native code)
# hangs at "Bundling client" when emulated. Each build pushes its image by
# digest, and the merge job puts the digests under one multi-platform tag.
#
# A pull request that changes this file builds both platforms without pushing.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    paths: [.github/workflows/publish.yml]
  workflow_dispatch:

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # The sha tag outranks latest so that, on main, the version baked into the image is the commit.
  # Both jobs work the tags out from this, so the build's VERSION matches the pushed tags.
  META_TAGS: |
    type=raw,value=latest,enable={{is_default_branch}}
    type=semver,pattern={{version}}
    type=semver,pattern={{major}}.{{minor}}
    type=sha,priority=300
    type=ref,event=pr

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    # A native build takes a few minutes; don't let a hang hold a runner for six hours.
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # GHCR names must be lowercase, and the repository is Kallb123/Wall-Display.
      - name: Work out the image name
        run: |
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}/calendar-app" >> "$GITHUB_ENV"
          platform='${{ matrix.platform }}'
          echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Work out the version
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: ${{ env.META_TAGS }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: calendar-app
          platforms: ${{ matrix.platform }}
          build-args: VERSION=${{ steps.meta.outputs.version }}
          tags: ${{ env.IMAGE }}
          outputs: type=image,push-by-digest=true,name-canonical=true,push=${{ github.event_name != 'pull_request' }}
          # A scope of its own per platform, so they don't evict each other or the amd64-only cache the CI docker job uses.
          cache-from: type=gha,scope=publish-${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,scope=publish-${{ env.PLATFORM_PAIR }},mode=max

      - name: Keep the digest
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          digest='${{ steps.build.outputs.digest }}'
          touch "$RUNNER_TEMP/digests/${digest#sha256:}"

      - name: Upload the digest
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - name: Work out the image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}/calendar-app" >> "$GITHUB_ENV"

      - name: Download the digests
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Work out the tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: ${{ env.META_TAGS }}

      - name: Push the multi-platform tags
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "$IMAGE@sha256:%s " *)

      - name: Inspect the image
        run: docker buildx imagetools inspect "$IMAGE:${{ steps.meta.outputs.version }}"
