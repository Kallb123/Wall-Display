name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: calendar-app
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: calendar-app/package.json

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: calendar-app/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - name: Check the migrations match the schema
        run: |
          pnpm db:generate
          if [ -n "$(git status --porcelain -- server/db/migrations)" ]; then
            git status --short -- server/db/migrations
            echo "::error::server/db/schema.ts changed without a migration. Run 'pnpm db:generate' and commit the result."
            exit 1
          fi
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
