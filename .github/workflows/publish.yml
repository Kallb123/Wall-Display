name: Publish images

# Builds the calendar-app image for amd64 and arm64 and pushes it to GHCR as
# ghcr.io/<owner>/<repo>/calendar-app (lowercased), which docker-compose.yml uses.
#
#   push to main   :latest and :sha-<short sha>
#   tag v1.2.3     :1.2.3, :1.2 and :sha-<short sha>
#
# A pull request that changes this file builds both platforms without pushing.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    paths: [.github/workflows/publish.yml]
  workflow_dispatch:

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  calendar-app:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # GHCR names must be lowercase, and the repository is Kallb123/Wall-Display.
      - name: Work out the image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}/calendar-app" >> "$GITHUB_ENV"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The sha tag outranks latest so that, on main, the version baked into the image is the commit.
      - name: Work out the tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,priority=300
            type=ref,event=pr

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: calendar-app
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          build-args: VERSION=${{ steps.meta.outputs.version }}
          # A scope of its own, so it doesn't evict the amd64-only cache the CI docker job uses.
          cache-from: type=gha,scope=publish
          cache-to: type=gha,scope=publish,mode=max
