[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wallcal-pi-agent"
dynamic = ["version"]
description = "The Wall Display agent that runs on the Raspberry Pi: MQTT availability, Home Assistant discovery and diagnostics."
readme = "README.md"
# Raspberry Pi OS Bookworm's system Python is 3.11.
requires-python = ">=3.11"
dependencies = [
  "paho-mqtt>=2.1,<3",
  "PyYAML>=6",
  "gpiozero>=2.0.1,<3",
  "pyserial>=3.5,<4",
  "smbus2>=0.4.3,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "jsonschema>=4.21",
  "ruff==0.17.3",
]

[project.scripts]
wallcal-agent = "wallcal_agent.cli:main"

# One place for the version: the package's __version__.
[tool.hatch.version]
path = "src/wallcal_agent/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/wallcal_agent"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["wallcal_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
