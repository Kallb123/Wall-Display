<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/organic-b7c8e5cf-1b74-40ce-b592-4fc0cbde078f/styles.css">
<script src="_ds/organic-b7c8e5cf-1b74-40ce-b592-4fc0cbde078f/_ds_bundle.js"></script>
<style>body{margin:0}a{color:var(--color-accent)}a:hover{color:var(--color-accent-600)}</style>
</helmet>
<div data-screen-label="Hybrid" style="width:{{ W }};height:{{ H }};display:flex;flex-direction:{{ dir }};overflow:hidden;background:{{ t.bg }};color:{{ t.text }};font-family:var(--font-body)">
  <sc-if value="{{ isPhoto }}" hint-placeholder-val="{{ true }}">
    <div style="flex:none;width:{{ firstW }};height:{{ firstH }};border-radius:{{ photoRadius }};overflow:hidden;position:relative">
      <dc-import name="Portrait Photo" fit="fill" size="compact" corner="top-left" style="width:100%;height:100%" hint-size="100%,100%"></dc-import>
    </div>
  </sc-if>
  <sc-if value="{{ isMonth }}" hint-placeholder-val="{{ false }}">
    <div style="flex:none;width:{{ firstW }};height:{{ firstH }};box-sizing:border-box;padding:{{ monthPad }};display:flex;flex-direction:column;gap:20px;min-height:0">
      <div style="display:flex;align-items:baseline;gap:16px;padding-left:12px;flex:none">
        <div style="font-family:var(--font-heading);font-size:64px;line-height:1;letter-spacing:-0.02em">October</div>
        <div style="font-family:var(--font-heading);font-size:32px;line-height:1;color:{{ t.muted }}">2026</div>
      </div>
      <div style="display:grid;grid-template-columns:repeat(7,minmax(0,1fr));column-gap:10px;flex:none;font-size:19px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:{{ t.muted }}">
        <div style="padding-left:14px">Mon</div><div style="padding-left:14px">Tue</div><div style="padding-left:14px">Wed</div><div style="padding-left:14px">Thu</div><div style="padding-left:14px">Fri</div><div style="padding-left:14px">Sat</div><div style="padding-left:14px">Sun</div>
      </div>
      <div style="flex:1;display:flex;flex-direction:column;gap:10px;min-height:0">
        <sc-for list="{{ weeks }}" as="w" hint-placeholder-count="5">
          <div style="flex:1;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));column-gap:10px;min-height:0">
            <sc-for list="{{ w.days }}" as="d" hint-placeholder-count="7">
              <div style="position:relative;border-radius:24px;background:{{ d.tileBg }};display:flex;flex-direction:column;justify-content:space-between;padding:8px 10px 14px 8px;min-width:0;overflow:hidden">
                <div style="min-width:40px;width:max-content;height:40px;border-radius:999px;display:grid;place-items:center;font-size:26px;font-weight:700;background:{{ d.numBg }};color:{{ d.numFg }}">{{ d.n }}</div>
                <div style="display:flex;flex-wrap:wrap;gap:6px;padding-left:6px">
                  <sc-for list="{{ d.dots }}" as="p" hint-placeholder-count="2">
                    <div style="width:16px;height:16px;border-radius:999px;background:{{ p.color }}"></div>
                  </sc-for>
                </div>
                <sc-if value="{{ d.isHalloween }}" hint-placeholder-val="{{ false }}">
                  <svg viewBox="0 0 120 100" width="44" height="37" style="position:absolute;top:8px;right:8px"><path d="M60 24 C60 14 64 8 72 5" style="fill:none;stroke:var(--color-accent-2-600);stroke-width:7;stroke-linecap:round"></path><ellipse cx="36" cy="60" rx="28" ry="34" style="fill:var(--color-accent-500)"></ellipse><ellipse cx="84" cy="60" rx="28" ry="34" style="fill:var(--color-accent-500)"></ellipse><ellipse cx="60" cy="60" rx="28" ry="38" style="fill:var(--color-accent-400)"></ellipse><path d="M44 54 L51 42 L58 54 Z M62 54 L69 42 L76 54 Z M42 68 Q60 84 78 68 Q60 76 42 68 Z" style="fill:var(--color-accent-900);stroke:var(--color-accent-900);stroke-width:3;stroke-linejoin:round"></path></svg>
                </sc-if>
                <div style="position:absolute;inset:0;border-radius:24px;pointer-events:none;background:{{ d.veil }}"></div>
              </div>
            </sc-for>
          </div>
        </sc-for>
      </div>
    </div>
  </sc-if>
  <div style="flex:1;min-width:0;min-height:0;position:relative">
    <dc-import name="Portrait Week" theme="{{ theme }}" title="short" style="width:100%;height:100%" hint-size="100%,100%"></dc-import>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:2560},&quot;kind&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;week_photo&quot;,&quot;month_week&quot;],&quot;default&quot;:&quot;week_photo&quot;,&quot;tsType&quot;:&quot;'week_photo'|'month_week'&quot;},&quot;orientation&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;portrait&quot;,&quot;landscape&quot;],&quot;default&quot;:&quot;portrait&quot;,&quot;tsType&quot;:&quot;'portrait'|'landscape'&quot;},&quot;theme&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;light&quot;,&quot;dark&quot;],&quot;default&quot;:&quot;light&quot;,&quot;tsType&quot;:&quot;'light'|'dark'&quot;}}">
class Component extends DCLogic {
  state = { m: null };
  componentDidMount() { import('./portrait-data.js').then(m => this.setState({ m })); }
  renderVals() {
    const theme = this.props.theme ?? 'light', kind = this.props.kind ?? 'week_photo', land = (this.props.orientation ?? 'portrait') === 'landscape';
    const isPhoto = kind === 'week_photo', isMonth = !isPhoto;
    const first = isPhoto ? (land ? '1100px' : '1000px') : (land ? '980px' : '1000px');
    const base = {
      theme, isPhoto, isMonth,
      W: land ? '2560px' : '1440px', H: land ? '1440px' : '2560px', dir: land ? 'row' : 'column',
      firstW: land ? first : '100%', firstH: land ? '100%' : first,
      photoRadius: land ? '0 64px 64px 0' : '0 0 64px 64px',
      monthPad: land ? '48px 0 48px 48px' : '48px 40px 0',
    };
    const m = this.state.m;
    if (!m) return { ...base, t: {}, weeks: [] };
    if (this._k !== theme) { this._k = theme; this._d = m.buildCompactMonth(theme); }
    return { ...base, ...this._d };
  }
}
</script>
</body>
</html>
