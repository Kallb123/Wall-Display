# Wall Display on the home server. See "Running with Docker" in README.md.
#
#   docker compose up -d                  the app
#   docker compose --profile mqtt up -d   the app and Mosquitto
#   docker compose pull && docker compose up -d   update to the latest image
#
# The image is built and published by .github/workflows/publish.yml. To build it
# from this checkout instead, add docker-compose.build.yml (see that file).
services:
  calendar-app:
    # :latest follows main. Pin a release (:1.2.3) or a commit (:sha-abc1234) to hold it still.
    image: ghcr.io/kallb123/wall-display/calendar-app:latest
    restart: unless-stopped
    ports: ["8080:8080"]
    environment:
      TZ: Europe/London
    volumes:
      - ./config:/config:ro   # config.yaml, secrets.yaml
      - ./data:/data          # SQLite, photo cache, special day art, Google OAuth tokens. Must be writable by uid 1000.

  # Skip this (leave the profile off) if you use the Home Assistant Mosquitto add-on.
  mosquitto:
    image: eclipse-mosquitto:2
    profiles: [mqtt]
    restart: unless-stopped
    ports: ["1883:1883"]
    volumes:
      - ./mosquitto/config:/mosquitto/config:ro
      - ./mosquitto/data:/mosquitto/data
